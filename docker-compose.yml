# DocuMind AI — Local Development Services
# ==========================================
# Purpose: Run local infrastructure for development.
# Currently manages: Qdrant (vector database)
#
# What is intentionally NOT here:
# - Redis / Celery (not used in MVP — see docs/DECISION_LOG.md DEC-001)
# - Kafka, Kubernetes, or other overengineered infra
# - Supabase (use cloud Supabase or the Supabase CLI separately)
#
# Prerequisites:
# - Docker Desktop installed and running
# - See README.md for full setup instructions
# ==========================================

name: documind-dev

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: documind-qdrant
    ports:
      - "6333:6333"   # REST API  — used by the FastAPI backend
      - "6334:6334"   # gRPC API  — available if needed
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__SERVICE__HTTP_PORT: 6333
      QDRANT__SERVICE__GRPC_PORT: 6334
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:6333/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  qdrant_data:
    name: documind_qdrant_data
